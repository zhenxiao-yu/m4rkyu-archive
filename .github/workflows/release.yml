name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate legacy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run build

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: M4rkyu.com Legacy ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## M4rkyu.com Legacy ${{ github.ref_name }}

            Archived Vite + React 18 portfolio. The active site has moved to
            zhenxiao-yu/M4rkyu.com (Next.js).
